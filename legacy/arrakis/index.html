<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0705">
    <title>Arrakis Imperial Archives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* Imperial Archives design tokens — aesthetic palette remap only.
           Recolors every Tailwind utility already used by the app's markup
           (amber->spice, zinc->warm sand, cyan->guild, red->blood,
           white->bone, black->obsidian). No logic, no markup changes. */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: { 300: '#ffc266', 400: '#f0a44a', 500: '#f0a44a', 600: '#d98a2e', 700: '#b45f1d', 800: '#8a4a18', 900: '#5f3211', 950: '#2a1808' },
                        zinc:  { 200: '#d8c8a6', 300: '#c8a97a', 400: '#a68f6b', 500: '#8a7355', 600: '#6b583f', 700: '#4a3b28', 800: '#2e2417', 900: '#14100b', 950: '#0a0705' },
                        cyan:  { 200: '#c9ebfe', 300: '#a5ddfb', 400: '#7dd3fc', 500: '#5cc2f2', 600: '#3fa9dd', 800: '#1d5f86', 900: '#123a52', 950: '#081c29' },
                        red:   { 300: '#f0a19b', 500: '#e0483e', 600: '#e0483e', 800: '#8a2a24', 900: '#5c1b17' },
                        white: '#ece0c8',
                        black: '#0a0705'
                    },
                    fontFamily: {
                        sans: ['Rajdhani', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/styles.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden font-sans select-none relative">

    <div id="loading-screen" class="fixed inset-0 z-[200] flex flex-col items-center justify-center">
        <div class="loader-eyebrow">IMPERIAL ARCHIVES <b>//</b> PLANETARY OPERATIONS</div>
        <h1 class="loader-title" aria-label="ARRAKIS"><span style="--i:0">A</span><span style="--i:1">R</span><span style="--i:2">R</span><span style="--i:3">A</span><span style="--i:4">K</span><span style="--i:5">I</span><span style="--i:6">S</span></h1>
        <div class="loader-bar" aria-hidden="true"><i></i></div>
        <button onclick="startApp()" class="loader-btn" title="Start System Initialization">INITIALIZE</button>
    </div>

    <div id="canvas-container" class="absolute inset-0 z-0 bg-black">
        <canvas id="canvas" class="w-full h-full absolute inset-0 z-10 cursor-crosshair block transition-opacity duration-1000" title="2D Map View"></canvas>
        <canvas id="canvas-3d" class="w-full h-full absolute inset-0 z-20 opacity-0 pointer-events-none transition-opacity duration-1000 cursor-grab active:cursor-grabbing" title="3D Globe View"></canvas>
    </div>

    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>

    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col">
        <div class="h-14 md:h-16 border-b border-amber-500/30 bg-black/70 backdrop-blur-md flex items-center px-2 md:px-4 justify-between pointer-events-auto shadow-md relative z-[80]">

            <div class="flex items-center gap-2 md:gap-4 flex-1 overflow-hidden">
                <a href="../index.html" class="flex items-center justify-center w-8 h-8 md:w-10 md:h-10 rounded-sm bg-zinc-900/80 border border-zinc-700/50 text-zinc-400 hover:text-amber-500 hover:border-amber-500/50 hover:bg-amber-500/10 transition-all shrink-0" title="Return to Macro Universe">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </a>

                <div class="hidden sm:block shrink-0 border-l border-zinc-800 pl-4 ml-1">
                    <div class="title text-lg md:text-xl text-amber-500 leading-none" title="Current Planetary System">ARRAKIS</div>
                    <div class="mono text-[8px] text-amber-600/60 tracking-[0.25em] uppercase mt-0.5">Canopus System</div>
                </div>

                <div id="top-nav-bar" class="flex items-center gap-1 md:gap-2 overflow-x-auto no-scrollbar flex-1 mask-edges sm:ml-4">
                    </div>
            </div>

            <div class="flex items-center gap-2 shrink-0 ml-2 border-l border-zinc-800 pl-2 md:pl-4">
                <button onclick="window.toggleCommandPalette()" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-sm bg-zinc-900/80 border border-zinc-700/50 text-xs text-zinc-400 hover:text-amber-500 hover:border-amber-500/50 transition-colors" title="Open Imperial Archives Search">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="mono tracking-widest">ARCHIVES</span>
                </button>
                <button onclick="toggleAudio()" id="audio-btn" class="w-8 h-8 md:w-auto md:px-3 rounded-sm bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-sm hover:bg-zinc-800 transition-colors" title="Toggle System Audio">🔈</button>
            </div>
        </div>

        <div id="dropdown-backdrop" class="fixed inset-0 z-[65] pointer-events-auto hidden" onclick="window.closeDropdown()"></div>
        <div id="dropdown-area" class="absolute top-14 md:top-16 left-0 w-full pointer-events-none z-[70] flex justify-center sm:justify-start sm:pl-[200px] pt-2 px-2"></div>
        <div class="flex-1 relative w-full pointer-events-none" id="workspace"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
