<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Globe test</title>
<style>html,body{margin:0;height:100%;background:#0a0705}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:10px;bottom:10px;color:#ece0c8;font:12px monospace;display:grid;gap:4px}</style></head>
<body><canvas id="c"></canvas><div id="ui">
<label>morph <input id="morph" type="range" min="0" max="1" step="0.01" value="0"></label>
<label>dist <input id="dist" type="range" min="1.15" max="6" step="0.01" value="3.2"></label>
<label>green <input id="green" type="range" min="0" max="1" step="0.01" value="0"></label>
<label>storms <input id="storms" type="range" min="0" max="1" step="0.01" value="0.5"></label>
<label>lat <input id="lat" type="range" min="-90" max="90" step="1" value="22"></label>
</div>
<script type="module">
import { ArrakisGlobe } from '/src/shared/globe/globe.ts';
import { onFrame } from '/src/shared/loop.ts';
const g = new ArrakisGlobe(document.getElementById('c'), { moons: true }); g.setSunFromView(-0.55, 0.3, 0.75);
window.globe = g;
const bind = (id, fn) => document.getElementById(id).addEventListener('input', e => fn(+e.target.value));
bind('morph', v => g.view.morph = v); bind('dist', v => g.view.distance = v); bind('green', v => g.setGreening(v)); bind('storms', v => g.setStorms(v)); bind('lat', v => g.view.centerLat = v);
onFrame((dt) => { g.view.centerLon += dt * (window.spin ?? 6); g.render(dt); });
</script></body></html>
